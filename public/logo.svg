<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#000"/>
  <g transform="translate(50,50) rotate(45)">
    <!-- Outer diamond -->
    <rect x="-35" y="-35" width="70" height="70" fill="none" stroke="#fff" stroke-width="6"/>
    <!-- Inner interlocking pattern -->
    <path d="M-35,-35 L-35,0 L0,0 L0,-35 Z" fill="none" stroke="#fff" stroke-width="4"/>
    <path d="M35,35 L35,0 L0,0 L0,35 Z" fill="none" stroke="#fff" stroke-width="4"/>
    <path d="M-35,35 L0,35 L0,0 L-35,0 Z" fill="none" stroke="#fff" stroke-width="4"/>
    <path d="M35,-35 L0,-35 L0,0 L35,0 Z" fill="none" stroke="#fff" stroke-width="4"/>
  </g>
</svg>
